<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relief — Reconcile</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; background: #141412; color: #e8e6e1; }
  h1 { font-size: 1.2rem; font-weight: 600; }
  input, button { font-size: 1rem; padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid #3a3934; background: #1e1d19; color: #e8e6e1; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 0.75rem; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  progress { width: 100%; height: 1.2rem; margin: 1rem 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; text-align: center; margin: 1rem 0; }
  .stats div { background: #1e1d19; border-radius: 6px; padding: 0.5rem; }
  .stats b { display: block; font-size: 1.3rem; }
  .stats span { font-size: 0.75rem; opacity: 0.7; }
  #log { font-family: ui-monospace, monospace; font-size: 0.8rem; white-space: pre-wrap; max-height: 200px; overflow-y: auto; background: #0f0f0d; padding: 0.75rem; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Reconcile R2 → D1</h1>
  <p>Scans everything under <code>music/</code> in R2 and creates or updates catalog rows for anything not already tracked. Safe to run repeatedly.</p>

  <input id="apiKey" type="password" placeholder="Admin API key (from /api/me)" />
  <button id="startBtn">Start reconcile</button>

  <progress id="bar" value="0" max="1" style="display:none"></progress>

  <div class="stats" id="stats" style="display:none">
    <div><b id="sScanned">0</b><span>scanned</span></div>
    <div><b id="sAdded">0</b><span>added</span></div>
    <div><b id="sUpdated">0</b><span>updated</span></div>
    <div><b id="sErrors">0</b><span>errors</span></div>
  </div>

  <div id="log"></div>

<script>
const startBtn = document.getElementById("startBtn");
const bar = document.getElementById("bar");
const stats = document.getElementById("stats");
const log = document.getElementById("log");

function line(text) {
  log.textContent += text + "\n";
  log.scrollTop = log.scrollHeight;
}

function setStats(d) {
  document.getElementById("sScanned").textContent = d.scanned;
  document.getElementById("sAdded").textContent = d.added;
  document.getElementById("sUpdated").textContent = d.updated;
  document.getElementById("sErrors").textContent = d.errors;
}

startBtn.addEventListener("click", async () => {
  const apiKey = document.getElementById("apiKey").value.trim();
  if (!apiKey) { alert("Enter your admin API key first."); return; }

  startBtn.disabled = true;
  bar.style.display = stats.style.display = "block";
  bar.removeAttribute("value"); // indeterminate until we know scale
  log.textContent = "";

  try {
    const startRes = await fetch(`/api/reconcile/start?apiKey=${encodeURIComponent(apiKey)}`, { method: "POST" });
    const startData = await startRes.json();
    if (!startData.ok) throw new Error(startData.error || "Failed to start job");
    const jobId = startData.jobId;
    line(`Started job ${jobId}`);

    let done = false;
    while (!done) {
      const stepRes = await fetch(`/api/reconcile/step?jobId=${jobId}&apiKey=${encodeURIComponent(apiKey)}`, { method: "POST" });
      const data = await stepRes.json();
      if (!data.ok) throw new Error(data.error || "Step failed");

      setStats(data);
      if (data.lastError) line(`⚠ ${data.lastError}`);
      done = data.done;
    }

    bar.value = 1; bar.max = 1;
    line("Done.");
  } catch (err) {
    line(`✗ ${err.message || err}`);
  } finally {
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
